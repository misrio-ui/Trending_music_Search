<!DOCTYPE html>  
<html lang="th">  
<head>  
 <meta charset="UTF-8">  
 <meta name="viewport" content="width=device-width, initial-scale=1.0">  
 <title>Deezer Music Player - Data Structures Demo</title>  
   
 <!-- Tailwind CSS CDN -->  
 <script src="https://cdn.tailwindcss.com"></script>  
   
 <!-- FontAwesome Icons -->  
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
   
 <!-- Google Fonts: Kanit & Inter for beautiful Thai typography -->  
 <link rel="preconnect" href="https://fonts.googleapis.com">  
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  
 <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">  
  
 <!-- เชื่อมโยงไฟล์ CSS ที่แยกออกไป -->
 <link rel="stylesheet" href="style.css">
</head>  
  
<body class="min-h-screen p-3 md:p-6 text-white flex flex-col justify-center items-center">  
  
 <div class="w-full max-w-6xl mx-auto bg-theme-main rounded-3xl p-4 md:p-6 space-y-4">  
  
 <!-- Top Header: Filters, Sort CTA, Search Bar -->  
 <header class="flex flex-col lg:flex-row items-center justify-between gap-3">  
   
 <!-- Category Filter Pills matching Image 2 -->  
 <div class="flex w-full flex-col items-start gap-2 lg:w-auto">
 <div class="flex items-center gap-2 w-full justify-start overflow-x-auto pb-1">
 <button id="filter-all" onclick="loadDeezerChart()" class="bg-pill-active px-6 py-2 rounded-full font-medium shadow transition hover:scale-105 active:scale-95 text-sm md:text-base">  
 <i class="fa-solid fa-music mr-1" aria-hidden="true"></i> เพลง
 </button>  
 <button id="filter-artist" onclick="loadDeezerArtists()" class="bg-pill px-6 py-2 rounded-full font-medium shadow transition hover:scale-105 active:scale-95 text-sm md:text-base">  
 <i class="fa-solid fa-microphone mr-1" aria-hidden="true"></i> นักร้อง
 </button>  
 <button id="filter-popular-albums" onclick="loadDeezerAlbums()" class="bg-pill px-6 py-2 rounded-full font-medium shadow transition hover:scale-105 active:scale-95 text-sm md:text-base whitespace-nowrap">
 <i class="fa-solid fa-layer-group mr-1"></i> อัลบั้ม
 </button>
   
 </div>

 <div class="flex items-center gap-2 w-full justify-start overflow-x-auto pb-1">
 <button id="sort-duration" onclick="runBubbleSort()" class="bg-white hover:bg-neutral-100 text-neutral-900 font-semibold px-4 py-2 rounded-full shadow transition hover:scale-105 active:scale-95 text-xs md:text-sm flex items-center gap-1.5 whitespace-nowrap">
 <span>ความยาวเพลง</span>
 </button>  
  
 <button id="sort-rank" onclick="runRankSort()" class="bg-white hover:bg-neutral-100 text-neutral-900 font-semibold px-4 py-2 rounded-full shadow transition hover:scale-105 active:scale-95 text-xs md:text-sm flex items-center gap-1.5 whitespace-nowrap">
 <span>ยอดวิว</span>
 </button>  
 </div>  
 </div>
  
 <!-- Search Bar matching Image 2 -->  
 <div class="relative w-full lg:w-72">  
 <input   
type="text"   
id="search-input"  
 placeholder="ค้นหาชื่อเพลง หรือ ศิลปิน..."   
onkeyup="handleSearch(this.value)"  
 class="w-full bg-neutral-100 text-neutral-900 placeholder-neutral-500 rounded-full pl-5 pr-11 py-2 font-medium focus:outline-none focus:ring-2 focus:ring-neutral-700 shadow-inner text-sm md:text-base"
 />  
 <button onclick="triggerSearch()" class="absolute right-3 top-1/2 -translate-y-1/2 text-purple-900 hover:text-purple-950 p-1">  
 <i class="fa-solid fa-magnifying-glass text-lg"></i>  
 </button>  
 </div>  
 </header>  
  
 <!-- Main Content Split Grid -->  
 <main class="grid grid-cols-1 lg:grid-cols-12 gap-4">  
  
 <!-- LEFT PANEL: Scrollable Music List (60% equivalent on lg) -->  
 <section class="lg:col-span-7 bg-panel-dark rounded-3xl p-4 md:p-5 shadow-2xl flex flex-col h-[580px]">  
   
 <!-- Left Panel Status Header -->  
 <div class="flex justify-between items-center mb-3 pb-2 border-b border-purple-400/20 px-1">  
 <div class="flex items-center gap-2">  
 <span class="text-xs uppercase tracking-wider bg-purple-900/60 text-purple-200 px-2.5 py-1 rounded-md font-semibold">  
 <i class="fa-solid fa-chart-line text-neutral-300 mr-1"></i> <span id="collection-label">Deezer Top Tracks</span>
 </span>  
 <span id="track-count" class="text-xs text-purple-200">(0 เพลง)</span>  
 </div>  
 <div class="text-xs text-purple-200 flex items-center gap-2">  
 <span id="sort-status-badge" class="bg-purple-800/80 px-2.5 py-0.5 rounded text-purple-200">  
 ค่าเริ่มต้น  
 </span>  
 <button onclick="loadDeezerChart()" class="hover:text-neutral-200 transition text-sm" title="โหลดเพลงฮิตล่าสุดจาก Deezer">
 <i class="fa-solid fa-rotate-right"></i>  
 </button>  
 </div>  
 </div>  
  
 <!-- Scrollable Song List Container -->  
 <div id="song-list-container" class="space-y-3 overflow-y-auto pr-2 custom-scrollbar flex-1">  
 <!-- Dynamically populated song cards -->  
 </div>  
 <button id="load-more-btn" onclick="loadMoreDeezerData()" title="โหลดเพิ่มเติม" aria-label="โหลดเพิ่มเติม" hidden class="mt-3 h-10 w-10 shrink-0 self-center rounded-full border border-purple-300/30 bg-purple-900/60 text-sm font-semibold text-purple-100 transition hover:bg-purple-800 disabled:cursor-wait disabled:opacity-70 flex items-center justify-center">
 <i class="fa-solid fa-plus"></i>
 </button>
 </section>  
  
 <!-- RIGHT PANEL: Details Box & Music Player (40% equivalent on lg) -->  
 <section class="lg:col-span-5 flex flex-col gap-4 h-[580px]">  
  
 <!-- TOP RIGHT BOX: Song Details Display (matching Image 2 top right) -->  
 <div class="bg-panel-dark rounded-3xl p-5 shadow-2xl flex-1 flex flex-col justify-between relative overflow-hidden">  
   
 <!-- Hash Table O(1) Indicator Badge -->  
 <div class="absolute top-3 right-4 bg-purple-950/70 border border-purple-400/30 rounded-lg px-2.5 py-1 text-[11px] text-purple-300 flex items-center gap-1.5 shadow">  
 <i class="fa-solid fa-bolt text-neutral-200"></i>
 <span>Hash Table Key: <strong id="hash-key-display" class="text-white">O(1)</strong></span>  
 </div>  
  
 <div class="space-y-2 mt-2">  
 <div class="text-xs text-purple-300 uppercase tracking-widest font-semibold flex items-center gap-1">  
 <i class="fa-solid fa-circle-info"></i> ข้อมูลรายละเอียดเพลง  
 </div>  
   
<h2 id="detail-title" class="text-2xl font-bold text-white truncate leading-tight">  
 เลือกเพลงเพื่อฟัง  
 </h2>  
 <p id="detail-artist" class="text-purple-200 text-base font-medium truncate">  
 ศิลปิน: -  
 </p>  
 <p id="detail-album" class="text-purple-300 text-sm truncate">  
 อัลบั้ม: -  
 </p>  
 </div>  
  
 <!-- Extra Specs Grid (matching Image 1 data specs) -->  
 <div class="grid grid-cols-2 gap-2 pt-3 border-t border-purple-400/20 text-xs">  
 <div class="bg-purple-900/50 p-2 rounded-xl">  
 <span class="text-purple-300 block">ยอดวิว / ความนิยม (Rank)</span>  
 <strong id="detail-rank" class="text-neutral-200 text-sm font-semibold">-</strong>
 </div>  
 <div class="bg-purple-900/50 p-2 rounded-xl">  
 <span class="text-purple-300 block">ความยาวเพลง (Duration)</span>  
 <strong id="detail-duration" class="text-neutral-300 text-sm font-semibold">- วินาที</strong>
 </div>  
 </div>  
 </div>  
  
 <!-- BOTTOM RIGHT BOX: Interactive Vinyl Turntable Player (matching Image 2 bottom right) -->  
 <div class="bg-panel-dark rounded-3xl p-5 shadow-2xl flex-1 flex flex-col items-center justify-between relative">  
   
 <!-- Vinyl Disk Artwork Wrapper -->  
 <div class="relative my-1 flex justify-center items-center">  
   
 <!-- Vinyl Record Outer Body -->  
 <div id="vinyl-record" class="w-36 h-36 md:w-40 md:h-40 rounded-full bg-slate-950 border-4 border-slate-900 shadow-2xl flex items-center justify-center relative vinyl-spin vinyl-paused transition-transform duration-500">  
   
 <!-- Groove lines styling -->  
 <div class="w-32 h-32 md:w-36 md:h-36 rounded-full border border-slate-800/80 flex items-center justify-center">  
 <div class="w-24 h-24 md:w-28 md:h-28 rounded-full border border-slate-800/80 flex items-center justify-center">  
   
 <!-- Center Album Cover Image -->  
 <img   
id="vinyl-cover"   
src="https://placehold.co/100x100/666666/ffffff?text=Deezer"
alt="Album Cover"  
 class="w-16 h-16 md:w-20 md:h-20 rounded-full object-cover border-2 border-neutral-400 shadow-inner"
 />  
   
 <!-- Vinyl Center Spindle Hole -->  
 <div class="absolute w-4 h-4 rounded-full bg-slate-950 border border-slate-700"></div>  
 </div>  
 </div>  
 </div>  
 </div>  
  
 <!-- Timeline Slider & Time Labels -->  
 <div class="w-full space-y-1">  
 <input   
type="range"   
id="audio-progress"   
min="0"   
max="100"   
value="0"   
oninput="seekAudio(this.value)"  
 class="w-full h-1.5 bg-purple-900 rounded-lg appearance-none cursor-pointer"  
 />  
 <div class="flex justify-between text-[11px] text-purple-300 px-1 font-mono">  
 <span id="current-time-txt">0:00</span>  
 <span id="total-time-txt">0:30 (Preview)</span>  
 </div>  
 </div>  
  
 <!-- Audio Player Controls Bar (matching Image 2 arrows & pause button) -->  
 <div class="flex items-center justify-between w-full px-4 pt-1">  
   
 <!-- Volume Control Toggle -->  
 <div class="flex items-center gap-1.5 w-20">  
 <i class="fa-solid fa-volume-high text-purple-300 text-xs"></i>  
 <input   
type="range"   
id="volume-slider"   
min="0"   
max="1"   
step="0.05"   
value="0.8"   
oninput="changeVolume(this.value)"  
 class="w-12 h-1 bg-purple-900 rounded-lg appearance-none cursor-pointer"  
 />  
 </div>  
  
 <!-- Player Action Buttons -->  
 <div class="flex items-center gap-4">  
 <!-- Previous Track -->  
 <button onclick="playPrevSong()" class="text-purple-200 hover:text-white transition text-2xl active:scale-90">  
 <i class="fa-solid fa-sharp fa-caret-left"></i><i class="fa-solid fa-sharp fa-caret-left -ml-2"></i>  
 </button>  
  
 <!-- Play / Pause Main Toggle Button -->  
 <button id="play-pause-btn" onclick="togglePlayPause()" class="w-11 h-11 bg-purple-300 hover:bg-white text-purple-950 rounded-full flex items-center justify-center shadow-lg transition transform hover:scale-110 active:scale-95">  
 <i id="play-icon" class="fa-solid fa-play ml-0.5 text-lg"></i>  
 </button>  
  
 <!-- Next Track -->  
 <button onclick="playNextSong()" class="text-purple-200 hover:text-white transition text-2xl active:scale-90">  
 <i class="fa-solid fa-sharp fa-caret-right"></i><i class="fa-solid fa-sharp fa-caret-right -ml-2"></i>  
 </button>  
 </div>  
  
 <!-- Data Indicator -->  
 <div class="text-[10px] text-purple-300 bg-purple-900/40 px-2 py-0.5 rounded-full">  
 <i class="fa-solid fa-music text-purple-400"></i> 30s MP3  
 </div>  
 </div>  
  
 </div>  
  
 </section>  
 </main>  
  
 <!-- Toast Notification Container for Algorithms & Messages -->  
 <div id="toast" class="fixed bottom-5 right-5 bg-purple-950 text-white border border-purple-400/40 px-4 py-3 rounded-2xl shadow-2xl transition-all duration-300 transform translate-y-20 opacity-0 flex items-center gap-3 z-50 max-w-sm">  
 <i id="toast-icon" class="fa-solid fa-circle-info text-neutral-300 text-lg"></i>
 <div id="toast-msg" class="text-sm">การแจ้งเตือน</div>  
 </div>  
  
 </div>  
  
 <!-- HTML5 Audio Element Hidden Instance -->  
 <audio id="audio-engine" preload="auto"></audio>  
  
 <!-- เชื่อมโยงไฟล์ JavaScript ที่แยกออกไป -->
 <script src="script.js"></script>  
</body>  
</html>
